<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina non trovata · I fiori di Raffaella</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..600&display=swap" rel="stylesheet" />
    <style>
      *{box-sizing:border-box;margin:0}
      body{min-height:100svh;display:grid;place-items:center;padding:24px;background:#f7f3ec;color:#2a2622;font:16px/1.5 Figtree,system-ui,sans-serif}
      main{width:100%;max-width:560px}
      .n{font-size:clamp(72px,18vw,160px);line-height:1;letter-spacing:-.05em;color:#7a4a2c}
      h1{margin-top:16px;font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.1;letter-spacing:-.025em}
      p{margin-top:12px;color:#665e55;font-size:18px}
      a{display:inline-flex;align-items:center;min-height:48px;margin-top:28px;padding:0 22px;border-radius:8px;background:#7a4a2c;color:#fff;font-weight:500;text-decoration:none;transition:background-color .2s,transform .16s}
      a:hover{background:#5e3820}a:active{transform:scale(.97)}
      @media (prefers-reduced-motion:no-preference){main{animation:in .8s cubic-bezier(.22,1,.36,1) both}@keyframes in{from{opacity:0;transform:translateY(20px)}}}
    </style>
  </head>
  <body>
    <main>
      <p class="n">404</p>
      <h1>Questa pagina non è più in vaso</h1>
      <p>Il link è sbagliato o la pagina è stata spostata.</p>
      <a href="/">Torna alla home</a>
    </main>
  </body>
</html>
